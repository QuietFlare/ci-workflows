# Copy to .github/workflows/codeql.yml.
#
# PUBLIC repo shown here: results upload to the Security tab (free) on a
# weekly schedule + on demand. For a personal PRIVATE repo (no Advanced
# Security), set `upload: false`, drop `security-events: write`, and prefer
# workflow_dispatch-only — the SARIF then arrives as a workflow artifact.
name: CodeQL

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    uses: QuietFlare/ci-workflows/.github/workflows/codeql-swift.yml@v1
    with:
      project: MyApp.xcodeproj
      scheme: MyApp
