# Release pipeline: test, then archive + upload to TestFlight.
# Copy to .github/workflows/release.yml.
#
# Ship a build by pushing a version tag:  git tag v1.0.0 && git push --tags
#
# Three repo secrets required (Settings → Secrets and variables → Actions),
# all from an App Store Connect API key (App Store Connect → Users and
# Access → Integrations):
#   ASC_KEY_ID     — the key ID
#   ASC_ISSUER_ID  — the issuer ID
#   ASC_KEY_P8     — full contents of the AuthKey_XXXX.p8 file
#
# Also needs .github/ExportOptions.plist in your repo — see the testflight
# reusable workflow's header for the minimum contents.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: QuietFlare/ci-workflows/.github/workflows/release-pipeline.yml@v1
    with:
      project: MyApp.xcodeproj
      scheme: MyApp
      only-testing: MyAppTests
    secrets:
      asc-key-id: ${{ secrets.ASC_KEY_ID }}
      asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
      asc-key-p8: ${{ secrets.ASC_KEY_P8 }}
