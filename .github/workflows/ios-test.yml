name: iOS Test (reusable)

# Build + run an iOS app's unit tests on a simulator, with optional SwiftLint
# and optional JDK/Gradle setup for Kotlin Multiplatform projects whose Xcode
# build embeds a KMP framework.
#
# Design notes:
# - No triggers here: callers own their triggers. On PRIVATE repos, macOS
#   runners bill at 10x — trigger on pull_request + workflow_dispatch only.
#   On PUBLIC repos, Actions minutes are free; trigger on push too if you like.
# - Tests run with CODE_SIGNING_ALLOWED=NO — no certificates or profiles needed.
# - The .xcresult bundle is always uploaded, pass or fail, so failures are
#   inspectable without re-running.
#
# Minimal caller:
#   jobs:
#     test:
#       uses: QuietFlare/ci-workflows/.github/workflows/ios-test.yml@v1
#       with:
#         project: MyApp.xcodeproj
#         scheme: MyApp

on:
  workflow_call:
    inputs:
      scheme:
        description: Xcode scheme to test
        required: true
        type: string
      project:
        description: Path to the .xcodeproj (ignored when `workspace` is set)
        required: false
        type: string
        default: ''
      workspace:
        description: Path to the .xcworkspace (takes precedence over `project`)
        required: false
        type: string
        default: ''
      destination:
        description: xcodebuild -destination string; must name a simulator that exists on the runner image for the chosen Xcode
        required: false
        type: string
        default: 'platform=iOS Simulator,name=iPhone 16'
      xcode-version:
        description: Xcode version selector (e.g. '16', '26', 'latest-stable'). Pick one whose iOS simulator runtime is preinstalled on the runner image.
        required: false
        type: string
        default: '16'
      runner:
        description: macOS runner label
        required: false
        type: string
        default: 'macos-15'
      only-testing:
        description: Restrict to one test target/class (xcodebuild -only-testing value). Empty runs everything in the scheme's test plan.
        required: false
        type: string
        default: ''
      swiftlint:
        description: Run SwiftLint before building
        required: false
        type: boolean
        default: false
      swiftlint-strict:
        description: Fail the job on SwiftLint violations (default is advisory — log but continue)
        required: false
        type: boolean
        default: false
      java-version:
        description: If set (e.g. '17'), install a Temurin JDK + Gradle cache before building — for KMP projects whose Xcode pre-build step runs Gradle. JAVA_HOME is exported for the whole job.
        required: false
        type: string
        default: ''
      prepare-command:
        description: Optional shell command run after toolchain setup, before SwiftLint/xcodebuild (e.g. 'xcodegen generate' or a Gradle framework link)
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name for the uploaded .xcresult artifact (change it when calling this workflow twice in one pipeline)
        required: false
        type: string
        default: 'test-results'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }} (Temurin)
        if: inputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle (cache + wrapper validation)
        if: inputs.java-version != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Prepare
        if: inputs.prepare-command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: eval "$PREPARE_COMMAND"

      - name: SwiftLint
        if: inputs.swiftlint
        continue-on-error: ${{ !inputs.swiftlint-strict }}
        run: |
          brew list swiftlint &>/dev/null || brew install swiftlint
          swiftlint lint --reporter github-actions-logging

      - name: Build & test (simulator, no signing)
        env:
          SCHEME: ${{ inputs.scheme }}
          PROJECT: ${{ inputs.project }}
          WORKSPACE: ${{ inputs.workspace }}
          DESTINATION: ${{ inputs.destination }}
          ONLY_TESTING: ${{ inputs.only-testing }}
        run: |
          set -o pipefail
          if [ -z "$WORKSPACE" ] && [ -z "$PROJECT" ]; then
            echo "::error::Provide either the 'project' or the 'workspace' input."
            exit 1
          fi
          args=()
          if [ -n "$WORKSPACE" ]; then
            args+=(-workspace "$WORKSPACE")
          else
            args+=(-project "$PROJECT")
          fi
          if [ -n "$ONLY_TESTING" ]; then
            args+=(-only-testing:"$ONLY_TESTING")
          fi
          xcodebuild test \
            "${args[@]}" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: TestResults.xcresult
          if-no-files-found: ignore
