name: Self-check

# CI for the CI: lint every workflow in this repo. Eating our own dog food —
# a broken reusable workflow breaks every consumer at once, so this gate runs
# on every change.
#
# - actionlint: syntax, expression typing, shellcheck of run: blocks
# - zizmor: security audit of workflow patterns (template injection,
#   permissions, unpinned actions). Advisory for now; tighten once the
#   baseline findings are triaged.
# - spec-tool: the unit tests of tools/spec_tool.py, and the lint run
#   against test-fixtures/spec-project, which must pass with warnings only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zizmor security audit (advisory)
        continue-on-error: true
        run: pipx run zizmor --no-online-audits .

  spec-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -v

      - name: Lint the fixture project
        run: python3 tools/spec_tool.py lint --root test-fixtures/spec-project
